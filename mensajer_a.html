<script>
const MESSAGES = [
  { from: 'them', text: '¡Buen día familia Miller! Quería contarles que Leo tuvo una excelente mañana. Estuvimos trabajando con pinturas de dedos y compartió muy bien con sus compañeros.', time: '10:30 AM' },
  { from: 'me', text: '¡Qué bueno! Gracias por contarnos, Maestra Ana. A él le encanta pintar en casa también.', time: '11:02 AM' },
  { from: 'them', text: 'Se nota. Cualquier cosa que necesiten para la clase de mañana me avisan por aquí.', time: '11:10 AM' },
];
const REPLY = '¡Recibido! Te aviso cualquier novedad. 😊';

function renderThread(){
  const thread = document.getElementById('chatThread');
  thread.innerHTML = MESSAGES.map(m => {
    if(m.from === 'me'){
      return `<div class="flex items-end gap-2 max-w-[85%] ml-auto justify-end">
        <div class="bg-primary text-on-primary rounded-2xl rounded-br-sm p-3 shadow-sm">
          <p class="font-body-md text-body-md">${m.text.replace(/</g,'&lt;')}</p>
          <div class="flex items-center justify-end gap-1 mt-1 text-on-primary/80">
            <span class="font-label-sm text-label-sm">${m.time}</span>
            <span class="material-symbols-outlined text-[16px]">done_all</span>
          </div>
        </div>
      </div>`;
    }
    return `<div class="flex items-end gap-2 max-w-[85%]">
      <img class="w-7 h-7 rounded-full object-cover mb-1 hidden md:block shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZcT9d-DBxq2Ezt5h-QlnZoXc3BZMB8FU61rzzhvsx-08B3D2Kvtr93uqnav0PcvlWP1o1xWhOuxAzMTw3oUSFuQVkHWnVHtwmlzVe-3OtURNhsxAtNaDfWdIwkA_OJvKrMC6UPxfbMuiIWmHS6oqAhUYpeR_X8ZmnhDF9IAExHIp-eXBNhYb4nzR8S-PdI3NZjpPhxkaIfoItitEji-2q8117qrzAvORh3Kjs1ViMUvscgJ6n52nD"/>
      <div class="bg-surface-container rounded-2xl rounded-bl-sm p-3 shadow-sm text-on-surface">
        <p class="font-body-md text-body-md">${m.text.replace(/</g,'&lt;')}</p>
        <span class="font-label-sm text-label-sm text-on-surface-variant mt-1 block text-right">${m.time}</span>
      </div>
    </div>`;
  }).join('');
  thread.scrollTop = thread.scrollHeight;
}

function sendMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const time = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  MESSAGES.push({ from: 'me', text, time });
  renderThread();
  input.value = '';

  setTimeout(() => {
    const replyTime = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    MESSAGES.push({ from: 'them', text: REPLY, time: replyTime });
    renderThread();
    showToast('Nuevo mensaje de Maestra Ana', 'mail');
  }, 1200);
}

renderThread();
</script>

<!-- Shared Toast Component -->
<div id="app-toast" class="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-[100] hidden transition-all duration-300">
  <div class="bg-inverse-surface text-inverse-on-surface px-5 py-3 rounded-full shadow-xl flex items-center gap-2 font-label-md text-label-md whitespace-nowrap">
    <span id="app-toast-icon" class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    <span id="app-toast-msg">Listo</span>
  </div>
</div>
<script>
function showToast(msg, icon){
  const t = document.getElementById('app-toast');
  if(!t) return;
  document.getElementById('app-toast-msg').textContent = msg;
  document.getElementById('app-toast-icon').textContent = icon || 'check_circle';
  t.classList.remove('hidden');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.add('hidden'), 2600);
}
</script>
